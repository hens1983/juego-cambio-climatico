<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<title>Guardianes de Cabo de Gata</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: pantalla completa vertical de móvil. HUD arriba, mapa isométrico de bloques en canvas, cruceta y botón A abajo. */
:root{
  --bg:#1f1b24;        /* noche de volcán */
  --panel:#2e2836;     /* roca oscura */
  --line:#4a4153;
  --text:#f4ecdc;      /* yeso */
  --muted:#b9ad9c;
  --accent:#f2a93b;    /* sol de Almería */
  --good:#7bd88f;
  --bad:#ff7a63;
  --display:'Silkscreen','Courier New',monospace;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  touch-action:manipulation;-webkit-user-select:none;user-select:none}
#app{box-sizing:border-box;height:100%;display:flex;flex-direction:column;gap:8px;padding-block:8px;max-width:560px;margin:0 auto}
.hud{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.stat{background:var(--panel);border:2px solid var(--line);padding:5px 4px;text-align:center;min-width:0}
.stat b{display:block;font-family:var(--display);font-size:15px;line-height:1.2;font-variant-numeric:tabular-nums}
.stat small{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.stat.warn b{color:var(--bad)}
.stat.ok b{color:var(--good)}
.bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums}
.bar{height:16px;background:var(--panel);border:2px solid var(--line);position:relative}
.bar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--accent)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--text);min-height:34px}
#hint{min-width:0;flex:1}
.mini{font:inherit;font-size:13px;font-weight:700;color:var(--text);background:var(--panel);border:2px solid var(--line);padding:6px 10px;cursor:pointer;white-space:nowrap}
#wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;border:3px solid var(--line);touch-action:none}
.ctl{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:2px}
.dpad{display:grid;grid-template-columns:repeat(2,56px);grid-template-rows:repeat(2,56px);gap:4px}
.dpad button,.abtn{font-family:var(--display);color:var(--text);background:var(--panel);border:3px solid var(--line);cursor:pointer;touch-action:none;font-size:20px}
.dpad button:active,.abtn:active{background:#3b3040;border-color:var(--accent)}
.dpad .l{grid-column:1;grid-row:1}.dpad .u{grid-column:2;grid-row:1}.dpad .d{grid-column:1;grid-row:2}.dpad .r{grid-column:2;grid-row:2}
.abtn{width:88px;height:88px;border-radius:50%;font-size:30px;background:#4a3a2a;border-color:var(--accent);color:var(--accent)}
.dpad button:focus-visible,.abtn:focus-visible,.mini:focus-visible,.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#toast{position:fixed;left:50%;top:calc(120px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 12px;font-weight:700;font-size:14px;max-width:calc(100% - 32px);text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}
#toast.show{opacity:1}
#modal{position:fixed;inset:0;background:rgba(15,12,18,.82);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20;overflow-y:auto}
#card{background:var(--panel);border:3px solid var(--accent);max-width:440px;width:100%;padding:18px;display:flex;flex-direction:column;gap:12px;max-height:100%;overflow-y:auto}
#card h2{font-family:var(--display);font-size:20px;margin:0;line-height:1.2;text-wrap:balance}
#card p{margin:0;line-height:1.45;font-size:15.5px}
.in{font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:3px solid var(--line);padding:10px 12px;width:100%;box-sizing:border-box;user-select:text;-webkit-user-select:text}
.in:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.lb{font-size:13px;color:var(--muted);letter-spacing:.03em}
.err{color:var(--bad);font-weight:700}
textarea.code{font:12px/1.3 ui-monospace,Menlo,Consolas,monospace;color:var(--text);background:var(--bg);border:2px solid var(--line);width:100%;box-sizing:border-box;padding:8px;resize:none;user-select:text;-webkit-user-select:text}
.opt small{display:block;font-weight:400;color:var(--muted);margin-top:2px}
.tag{display:inline-block;font-size:12px;background:var(--bg);border:2px solid var(--line);padding:2px 8px;color:var(--accent);align-self:flex-start;letter-spacing:.03em}
.sw{width:44px;height:44px;border:3px solid var(--text);flex:none}
.head{display:flex;gap:12px;align-items:center}
.opts{display:flex;flex-direction:column;gap:8px}
.opt,.btn{font:inherit;font-weight:700;color:var(--text);background:var(--bg);border:3px solid var(--line);padding:11px 12px;text-align:left;cursor:pointer;min-height:46px}
.btn{background:var(--accent);color:#2a1d08;border-color:var(--accent);text-align:center;font-family:var(--display)}
.opt.right{border-color:var(--good);background:#1f3a2a}
.opt.wrong{border-color:var(--bad);background:#3f2420}
.quests{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.quests li{display:flex;gap:10px;align-items:baseline;line-height:1.35}
.quests .ck{font-family:var(--display);color:var(--muted);flex:none}
.quests li.done .ck{color:var(--good)}
.quests small{color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}
.stats-end{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats-end div{background:var(--bg);border:2px solid var(--line);padding:8px;font-size:13px;color:var(--muted)}
.stats-end b{display:block;font-family:var(--display);font-size:18px;color:var(--text)}
.help{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.help li{background:var(--bg);border:2px solid var(--line);padding:8px 10px;line-height:1.4;font-size:15px}
.help b{display:block;color:var(--accent);font-size:13px;letter-spacing:.03em}
.goal{display:flex;flex-direction:column;gap:6px;background:var(--bg);border:2px solid var(--accent);padding:10px}
.nav{display:flex;gap:8px}.nav>*{flex:1}.nav .opt{text-align:center}
.rocks{display:flex;gap:6px}
.rocks span{width:22px;height:22px;border:2px solid var(--line);background:var(--bg)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>

<div id="app">
  <div class="hud">
    <div class="stat"><b id="sYear">2025</b><small>Año</small></div>
    <div class="stat" id="stCo2"><b id="sCo2">420</b><small>CO₂ ppm</small></div>
    <div class="stat" id="stTemp"><b id="sTemp">+1.1°</b><small>Temp.</small></div>
    <div class="stat" id="stSea"><b id="sSea">0</b><small>Mar cm</small></div>
    <div class="stat"><b id="sSci">8</b><small>Ciencia</small></div>
  </div>
  <div class="bar" aria-label="Progreso hasta 2050"><i id="prog"></i><span id="progT"></span></div>
  <div class="row"><span id="hint"></span><button class="mini" id="bQuest">Misiones</button></div>
  <div id="wrap"><canvas id="cv" aria-label="Mapa de Almería"></canvas></div>
  <div class="ctl" id="ctlWorld">
    <div class="dpad">
      <button class="l" data-d="-1,0" aria-label="Subir hacia la izquierda">↖</button>
      <button class="u" data-d="0,-1" aria-label="Subir hacia la derecha">↗</button>
      <button class="d" data-d="0,1" aria-label="Bajar hacia la izquierda">↙</button>
      <button class="r" data-d="1,0" aria-label="Bajar hacia la derecha">↘</button>
    </div>
    <button class="abtn" id="bA" aria-label="Actuar">A</button>
  </div>
  <div class="ctl" id="ctlCave" hidden><button class="btn" id="bExit" style="width:100%">Salir de la cueva</button></div>
</div>
<div id="toast"></div>
<div id="modal" hidden><div id="card"></div></div>

<script>
(function(){
const COLS=10, ROWS=12, CAVE_ROWS=14, YEAR_SEC=36, END_YEAR=2050, LOSE_SEA=60;

const BAL=Object.assign({base:6,solar:1,bus:.7,reci:.5,ev:.7,tree:.3,pos:.4,floor:420,litterSec:15,litterMax:5,stipend:2,costMul:1.2},window.__TEST__&&window.__BAL__||{});
const price=v=>Math.round(v*BAL.costMul);

 1:{n:'Suelo',kind:'Suelo',sci:1,c:'#8a5a32',a:'#6d4524',b:'#a4713f',

Object.assign(CARDS,{
 gei:{n:'Efecto invernadero',kind:'Panel informativo',c:'#f2a93b',
  fact:'La atmósfera retiene parte del calor del Sol, como el cristal de un invernadero. Es natural y necesario: sin él la Tierra sería unos 33 °C más fría. El problema es el exceso de gases como el CO₂ y el metano.',

  q:'¿Qué ayuda a frenar la desertificación?',o:['Mantener vegetación y cuidar el suelo','Talar los árboles','Quemar rastrojos'],a_:0},
 agua:{n:'El agua en Almería',kind:'Panel informativo',c:'#f2a93b',
  fact:'En Almería llueve poco y el agua viene de pozos, desaladoras y aguas regeneradas. Ahorrar agua y regar de forma eficiente es una forma de adaptarse al cambio climático.',

  fact:'El tiempo es lo que pasa hoy o esta semana: lluvia, calor, viento. El clima es el promedio del tiempo durante muchos años, normalmente 30 o más.',

 mitig:{n:'Mitigar y adaptar',kind:'Panel informativo',c:'#f2a93b',
  fact:'Mitigar es reducir las emisiones, por ejemplo con energía solar o transporte público. Adaptar es prepararse para los efectos que ya llegan, por ejemplo guardando agua o protegiendo la costa. Hacen falta las dos cosas.',

  fact:'Con el calentamiento el agua del mar se dilata y los glaciares y casquetes de hielo se funden, así que el nivel del mar sube. Las playas y las zonas bajas son las más afectadas.',
  q:'¿Por qué sube el nivel del mar?',o:['El agua se dilata y el hielo se funde','Llueve más en la costa','Hay más peces'],a_:0},

  fact:'El océano absorbe gran parte del calor y del CO₂ extra. Por eso se calienta y se acidifica. Las olas de calor marinas dañan praderas como las de posidonia.',
  q:'El océano absorbe…',o:['Calor y CO₂ de la atmósfera','Solo sal','Solo lluvia'],a_:0}
});
[1,2,3,4,5].forEach(t=>{ROCKS[t].rw=2});['tree','solar','pos'].forEach(k=>{CARDS[k].rw=2});
Object.keys(CARDS).forEach(k=>{if(CARDS[k].rw===undefined)CARDS[k].rw=4});

 {fact:'¡Reto de la profe!',q:'¿Por qué es mala la deforestación para el clima?',o:['Hay menos árboles que absorban CO₂','Hace que llueva más','Sube la sal del mar'],a_:0},
 {fact:'¡Reto de la profe!',q:'¿Qué puedes hacer tú para ayudar?',o:['Ir andando o en bici y ahorrar energía','Dejar las luces encendidas','Tirar plástico al mar'],a_:0},
 {fact:'¡Reto de la profe!',q:'El límite de +1.5 °C se propone para…',o:['Frenar los peores efectos del calentamiento','Medir la temperatura del aula','Calcular la altura de las olas'],a_:0},
 {fact:'¡Reto de la profe!',q:'¿Qué es la huella de carbono?',o:['El CO₂ que emitimos con lo que hacemos','La marca de un zapato en la arena','Un tipo de roca'],a_:0},

function setRetos(list){
  Object.keys(CARDS).forEach(k=>{if(/^reto\d+$/.test(k))delete CARDS[k]});
  RETOS.length=0;list.forEach(r=>RETOS.push(r));
  RETOS.forEach((r,i)=>{CARDS['reto'+i]=Object.assign({n:'Reto de la profe',kind:'Reto',c:'#7bd88f',rw:4},r)});

setRetos(RETOS.slice());

const PANELS=['gei','causas','desert','agua','clima','mitig','mar','oceano'];
const Q0={p:Object.fromEntries(PANELS.map(k=>[k,{fact:CARDS[k].fact,q:CARDS[k].q,o:CARDS[k].o.slice(),a_:CARDS[k].a_}])),r:RETOS.slice()};
function applyQ(list){
  if(!Array.isArray(list))return;
  const t=v=>String(v==null?'':v).trim(),inc=p=>(Array.isArray(p.incorrectas)?p.incorrectas:[]).map(t).filter(Boolean);
  const full=p=>t(p.pregunta)&&t(p.correcta)&&inc(p).length>0,opts=p=>[t(p.correcta)].concat(inc(p)).slice(0,4);
  PANELS.forEach(k=>Object.assign(CARDS[k],Q0.p[k],{o:Q0.p[k].o.slice()}));
  list.forEach(p=>{const k=t(p&&p.id);if(!PANELS.includes(k))return;const C=CARDS[k];

const BOARDS=[[['desert','agua'],['clima','mitig']],[['gei','causas'],['mar','oceano']]];

function hash(c,r,k){const x=Math.sin(c*127.1+r*311.7+k*74.7)*43758.5453;return x-Math.floor(x)}
function lerp(a,b,t){return a+(b-a)*t}
function mix(c1,c2,t){const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));const a=p(c1),b=p(c2);return 'rgb('+a.map((v,i)=>Math.round(lerp(v,b[i],t))).join(',')+')'}

function makeCave(){
  const g=[];
  for(let r=0;r<CAVE_ROWS;r++){g[r]=[];for(let c=0;c<COLS;c++){
    if(r===0){g[r][c]=9;continue}
    let t=Math.min(5,Math.floor((r-1)/3)+1);
    const j=hash(c,r,3);if(j<.12)t=Math.max(1,t-1);else if(j>.88)t=Math.min(5,t+1);
    g[r][c]=t;
  }}
  return g;
}

/* ---------- mapa ---------- */
const sk=(c,r)=>S.sx+','+S.sy+','+c+','+r;
function ch(c,r){return MAPS[S.sy][S.sx][r][c]}
function solid(c,r){
  const x=ch(c,r);
  if('#~NFSHcIA'.includes(x))return true;
  if(x==='T'){const o=S.spots[sk(c,r)];return !!(o&&!o.dead)}
  return false;
}
function actionAt(c,r){
  if(c<0||r<0||c>=COLS||r>=ROWS)return null;
  const x=ch(c,r),o=S.spots[sk(c,r)];
  if(x==='T'&&(!o||o.dead))return{a:'tree',c,r};
  if(x==='P'&&(!o||o.dead))return{a:'pos',c,r};
  if(x==='S'&&!o)return{a:'solar',c,r};
  if(x==='N')return{a:'talk',c,r};
  if(x==='F')return{a:'fab',c,r};
  if(x==='I')return{a:'board',c,r};
  if(x==='A')return{a:'ayto',c,r};
  return null;
}
function pickAction(){
  for(const [dx,dy] of [[0,0],[S.fx,S.fy],[0,-1],[0,1],[-1,0],[1,0]]){
    const a=actionAt(S.x+dx,S.y+dy);if(a)return a;
  }
  return null;
}
function interact(a){
  if(a.a==='talk')return npc();
  if(a.a==='fab')return modal(`<h2>La fábrica</h2><span class="tag">Fuente de CO₂</span><p>Quema combustibles fósiles y ahora emite unos <b>${emis().toFixed(1)} ppm</b> de CO₂ al año. Cada placa solar reduce ${ppmTxt(BAL.solar)} ppm al año y cada medida del Ayuntamiento reduce más.</p><button class="btn" data-act="close">Vale</button>`);
  if(a.a==='board'){const id=boardId(a.c,a.r),again=!!S.read[id];S.read[id]=true;checkQuests();showCard(id,again);return}
  if(a.a==='ayto')return aytoModal();
  const k=a.a;
  if(S.sci<COST[k]){toast('Te faltan '+(COST[k]-S.sci)+' 🔬. Lee paneles, haz los retos de la profe o recoge basura.');return}
  S.sci-=COST[k];S.spots[sk(a.c,a.r)]={k,dead:false,born:S.t};
  toast(k==='tree'?'Árbol plantado: absorbe CO₂':k==='solar'?'Placa solar: la fábrica emite menos':'Posidonia sembrada: absorbe CO₂');
  checkQuests();refresh();
  if(!S.seen[k]){S.seen[k]=true;showCard(k)}
}

  const state=tp>1.5?'Vamos tarde: ya estamos en +'+tp.toFixed(1)+' °C. Hay que bajar el CO₂.':'Vamos bien: estamos en +'+tp.toFixed(1)+' °C. Hay que mantenerlo.';

/* ---------- movimiento ---------- */
function tryMove(dx,dy){
  S.fx=dx;S.fy=dy;
  const nx=S.x+dx,ny=S.y+dy;
  if(nx<0||ny<0||nx>=COLS||ny>=ROWS){
    const nsx=S.sx+(nx>=COLS?1:nx<0?-1:0),nsy=S.sy+(ny>=ROWS?1:ny<0?-1:0);
    if(!MAPS[nsy]||!MAPS[nsy][nsx])return false;
    const c=(nx+COLS)%COLS,r=(ny+ROWS)%ROWS,keep=[S.sx,S.sy];
    S.sx=nsx;S.sy=nsy;
    if(solid(c,r)){S.sx=keep[0];S.sy=keep[1];return false}
    S.x=c;S.y=r;S.vx=c;S.vy=r;S.smoke=[];toast(NAMES[S.sy][S.sx]);
    return true;
  }
  if(solid(nx,ny))return false;
  S.x=nx;S.y=ny;
  if(ch(nx,ny)==='C')S.enter=true;
  return true;
}
function bfs(goalFn){
  const q=[[S.x,S.y]],prev={},key=(c,r)=>c+','+r;prev[key(S.x,S.y)]=null;
  while(q.length){
    const [c,r]=q.shift();
    if(goalFn(c,r)){
      const path=[];let k=key(c,r);
      while(prev[k]){path.unshift(prev[k].d);k=prev[k].k}
      return path;
    }
    for(const [dx,dy] of [[0,-1],[0,1],[-1,0],[1,0]]){
      const nx=c+dx,ny=r+dy;if(nx<0||ny<0||nx>=COLS||ny>=ROWS||solid(nx,ny)||prev[key(nx,ny)]!==undefined)continue;
      prev[key(nx,ny)]={k:key(c,r),d:[dx,dy]};q.push([nx,ny]);
    }
  }
  return null;
}
function tapWorld(c,r){
  S.hold=null;S.path=[];S.after=null;
  if(solid(c,r)){
    const a=actionAt(c,r);
    const adj=(x,y)=>Math.abs(x-c)+Math.abs(y-r)===1;
    if(adj(S.x,S.y)){S.fx=c-S.x;S.fy=r-S.y;if(a)interact(a);return}
    const p=bfs(adj);
    if(p){S.path=p;if(a)S.after={c,r,a}}
    else toast('No hay camino hasta ahí.');
  }else{
    const p=bfs((x,y)=>x===c&&y===r),a=actionAt(c,r);
    if(p){S.path=p;if(a)S.after={c,r,a}}else toast('No hay camino hasta ahí.');
  }
}
function actionPress(){
  if(S.paused||S.over||S.mode!=='world')return;
  const a=pickAction();
  if(a)interact(a);else toast('Aquí no hay nada que hacer.');
}

const canvasXY=e=>{const rc=cv.getBoundingClientRect();return[e.clientX-rc.left-cv.clientLeft,e.clientY-rc.top-cv.clientTop]};
function digAt(e){const [mx,my]=canvasXY(e),p=pickCave(mx,my);if(p)digCell(p.c,p.r)}
function digCell(c,r){
  const t=S.cave[r][c];
  if(r===0||t===0){toast(r===0?'Excava hacia abajo.':'Ya está excavado.');return}

cv.addEventListener('pointerdown',e=>{

/* ---------- dibujo isométrico (bloques) ----------
   Mundo: x = columna, y = fila, z = altura en bloques. En pantalla: X=(x-y)·U, Y=(x+y)·U/2 − z·U.
   La cámara mira desde +x,+y: se ven la cara de arriba, la que da a +y (izquierda) y la que da a +x (derecha).
   El suelo, que no tapa nada, se pinta una vez en una imagen; lo demás se ordena de atrás hacia delante en cada fotograma. */
let U=30,VW=300,VH=300,OX=0,OY=0,camX=0,camY=0,camKey='',gc=null,gKey='',drag=null;
const SHADE=new Map();
function shade(col,f){
  const k=col+'|'+f;let v=SHADE.get(k);

}
const SX=(x,y)=>(x-y)*U+OX,SY=(x,y,z)=>(x+y)*U*.5-z*U+OY;
function poly(col,ns,a,b,c,d,e,f,g,h){
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.lineTo(e,f);ctx.lineTo(g,h);ctx.closePath();ctx.fill();
  if(!ns&&!(col[0]==='r'&&col[3]==='a')){ctx.strokeStyle=col;ctx.stroke()}   /* el trazo tapa las rendijas entre caras */
}
function flat(col,x,y,z,w,d,ns){poly(col,ns,SX(x,y),SY(x,y,z),SX(x+w,y),SY(x+w,y,z),SX(x+w,y+d),SY(x+w,y+d,z),SX(x,y+d),SY(x,y+d,z))}
function faceY(col,x,y,z,w,h,ns){if(h>0)poly(col,ns,SX(x,y),SY(x,y,z+h),SX(x+w,y),SY(x+w,y,z+h),SX(x+w,y),SY(x+w,y,z),SX(x,y),SY(x,y,z))}
function faceX(col,x,y,z,d,h,ns){if(h>0)poly(col,ns,SX(x,y),SY(x,y,z+h),SX(x,y+d),SY(x,y+d,z+h),SX(x,y+d),SY(x,y+d,z),SX(x,y),SY(x,y,z))}
function box3(x,y,z,w,d,h,cT,cL,cR){
  if(w<=0||d<=0||h<=0)return;
  faceY(cL,x,y+d,z,w,h);faceX(cR,x+w,y,z,d,h);flat(cT,x,y,z+h,w,d);
}
/* Bloque con las tres caras sombreadas; sp = motas de textura {c,r,a,b,n}. */
function box(x,y,z,w,d,h,col,sp){
  if(w<=0||d<=0||h<=0)return;
  box3(x,y,z,w,d,h,col,shade(col,.8),shade(col,.62));
  if(!sp)return;
  const s=Math.min(w,d,h,1)*.18,z1=z+h;
  for(let i=0;i<sp.n;i++){
    const u=.06+hash(sp.c,sp.r,i)*.7,v=.06+hash(sp.c,sp.r,i+9)*.7,k=i%2?sp.a:sp.b;
    flat(k,x+u*(w-s),y+v*(d-s),z1,s,s,1);
    if(i<2){faceY(shade(k,.8),x+u*(w-s),y+d,z+v*(h-s),s,s,1);faceX(shade(k,.62),x+w,y+u*(d-s),z+v*(h-s),s,s,1)}
  }
}
const shadow=(x,y,w,d)=>flat('rgba(0,0,0,.22)',x+.06,y+.1,1.004,w,d,1);
function spk(c,r,z,n,ca,cb){for(let i=0;i<n;i++)flat(i%2?ca:cb,c+.08+hash(c,r,i)*.72,r+.08+hash(c,r,i+9)*.72,z,.14,.14,1)}

/* Altura del terreno (para las caras laterales y para saber qué se toca). */
function gz(M,c,r,fl){
  if(c<0||r<0||c>=COLS||r>=ROWS)return 0;
  const x=M[r][c];
  if(x==='~')return .55;
  if(x===','||x==='P'||((x==='1'||x==='2'||x==='3')&&+x<=fl))return .75;
  return 1;
}
const isWater=(M,c,r,fl)=>gz(M,c,r,fl)<1;
function tileGround(M,c,r,th,fl){
  const x=M[r][c],z=gz(M,c,r,fl),water=z<1;
  const hex=water?(x==='~'?'#2468b0':'#4fa3e8'):th.g,top=(x==='1'||x==='2'||x==='3')&&!water?shade(th.g,1.1):hex;
  const hy=z-gz(M,c,r+1,fl),hx=z-gz(M,c+1,r,fl);
  const side=(h,f,fy)=>{
    const band=water?h:Math.min(h,.26),ct=water?shade(hex,f):shade(hex,f*.95),cd=shade(th.w,f);
    const zb=z-h;
    if(fy){faceY(ct,c,r+1,z-band,1,band);if(!water)faceY(cd,c,r+1,zb,1,h-band)}
    else{faceX(ct,c+1,r,z-band,1,band);if(!water)faceX(cd,c+1,r,zb,1,h-band)}
  };
  if(hy>0)side(hy,.8,true);
  if(hx>0)side(hx,.62,false);
  flat(top,c,r,z,1,1);
  if(!water)spk(c,r,z,4,th.ga,th.gb);
}
function buildGround(th,M,fl){
  const pad=6,gw=Math.ceil((COLS+ROWS)*U+pad*2),gh=Math.ceil((COLS+ROWS)*U*.5+U+pad*2);
  if(!gc)gc=document.createElement('canvas');
  gc.width=Math.round(gw*dpr);gc.height=Math.round(gh*dpr);
  const g=gc.getContext('2d'),keep=ctx,kx=OX,ky=OY;
  ctx=g;g.setTransform(dpr,0,0,dpr,0,0);g.lineJoin='round';g.lineWidth=1;
  OX=ROWS*U+pad;OY=U+pad;gc._x=OX;gc._y=OY;gc._w=gw;gc._h=gh;
  for(let s=0;s<=COLS+ROWS-2;s++)for(let c=Math.max(0,s-ROWS+1);c<=Math.min(COLS-1,s);c++)tileGround(M,c,s-c,th,fl);
  if(S.sx===0&&S.sy===1&&fl>=1){   /* el mar sube y se come las calles del pueblo */
    for(let r=fl>=2?9:10;r<=10;r++)for(let c=1;c<COLS-1;c++){flat('rgba(79,163,232,.8)',c,r,1.03,1,1,1);flat('rgba(160,215,250,.5)',c+.15,r+.4,1.04,.5,.08,1)}
  }
  ctx=keep;OX=kx;OY=ky;
}

/* Alturas [arriba, base] de lo que hay en cada casilla: sirve para tocar justo lo que se ve. */
function topZ(M,c,r,fl){
  const x=M[r][c],o=S.spots[sk(c,r)];
  if(x==='#'||x==='C')return[2,1];
  if(x==='T')return[o&&!o.dead?2.15:1.2,1];
  if(x==='S'||x==='H'||x==='F'||x==='N')return[2,1];
  if(x==='I'||x==='A')return[2.1,1];
  if(x==='c')return[1.85,1];
  const z=gz(M,c,r,fl);return[z,z];
}
function hexPts(c,r,zt,zb){
  const A=[SX(c,r),SY(c,r,zt)],B=[SX(c+1,r),SY(c+1,r,zt)],C=[SX(c+1,r+1),SY(c+1,r+1,zt)],D=[SX(c,r+1),SY(c,r+1,zt)];
  if(zt<=zb)return[A,B,C,D];
  return[A,B,[B[0],SY(c+1,r,zb)],[C[0],SY(c+1,r+1,zb)],[D[0],SY(c,r+1,zb)],D];
}
function inPoly(px,py,P){
  let k=false;
  for(let i=0,j=P.length-1;i<P.length;j=i++){
    const a=P[i],b=P[j];
    if((a[1]>py)!==(b[1]>py)&&px<(b[0]-a[0])*(py-a[1])/(b[1]-a[1])+a[0])k=!k;
  }

}
/* Casillas de delante hacia atrás; la primera que contiene el punto es la que ve el jugador. */
function pickAt(mx,my,rowsN,info){
  const a=(mx-OX)/U,b=2*(my-OY+U)/U,x0=Math.floor((a+b)/2),y0=Math.floor((b-a)/2),L=[];
  for(let c=Math.max(0,x0-5);c<=Math.min(COLS-1,x0+6);c++)for(let r=Math.max(0,y0-5);r<=Math.min(rowsN-1,y0+6);r++)L.push([c,r]);
  L.sort((p,q)=>q[0]+q[1]-p[0]-p[1]);

const pickWorld=(mx,my)=>{const M=MAPS[S.sy][S.sx],fl=floodStep();return pickAt(mx,my,ROWS,(c,r)=>topZ(M,c,r,fl))};
const pickCave=(mx,my)=>pickAt(mx,my,CAVE_ROWS,(c,r)=>S.cave[r][c]===0?[0,0]:[1,0]);

/* ----- cámara ----- */
function bounds(){
  return S.mode==='cave'?{x0:-CAVE_ROWS*U-U,x1:COLS*U+U,y0:-2*U,y1:(COLS+CAVE_ROWS)*U*.5+U}:{x0:-ROWS*U-U,x1:COLS*U+U,y0:-3.4*U,y1:(COLS+ROWS)*U*.5+U};

function clampCam(){

  camY=B.y1-B.y0<=VH?(B.y0+B.y1)/2:Math.max(B.y0+VH/2,Math.min(B.y1-VH/2,camY));
}
function aim(dt,wx,wy,wz){
  const key=S.mode+S.sx+S.sy,tx=(wx-wy)*U,ty=(wx+wy)*U*.5-wz*U;

const onScreen=(c,r)=>{const X=(c-r)*U+OX,Y=(c+r+1)*U*.5-U+OY;return X>-2.4*U&&X<VW+2.4*U&&Y>-3.4*U&&Y<VH+2.4*U};

function drawWorld(dt){

  if(gKey!==key||!gc){gKey=key;buildGround(th,M,fl)}

  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){   /* brillos del agua */
    if(!isWater(M,c,r,fl)||!onScreen(c,r))continue;
    const w=Math.sin(S.t*2+c+r)*.06,z=gz(M,c,r,fl)+.004,k=M[r][c]==='~'?'#3d86d0':'#8ac6f5';

  }
  let done=false;const pk=Math.floor(S.vx+S.vy+1e-4);
  for(let s=0;s<=COLS+ROWS-2;s++){
    for(let c=Math.max(0,s-ROWS+1);c<=Math.min(COLS-1,s);c++){
      const r=s-c;if(!onScreen(c,r))continue;
      objW(c,r,M[r][c],th);
    }
    for(const l of S.litter)if(l.sx===S.sx&&l.sy===S.sy&&l.c+l.r===s)drawLitter(l);
    if(!done&&s>=pk){drawPlayer();done=true}
  }
  if(S.sx===0&&S.sy===1){
    if(!S.paused){S.spawn+=dt*emis()*1.4;while(S.spawn>=1){S.spawn--;S.smoke.push({x:7.73,y:7.33,l:0})}}
    S.smoke=S.smoke.filter(p=>p.l<3.2);
    for(const p of S.smoke){
      if(!S.paused){p.l+=dt;p.x+=dt*.1}
      const a=(.75*(1-p.l/3.2)).toFixed(2),s=.2+p.l*.1;
      box3(p.x-s/2,p.y-s/2,2.85+p.l*.7,s,s,s,'rgba(96,92,104,'+a+')','rgba(76,72,84,'+a+')','rgba(58,54,66,'+a+')');
    }
  }
  drawMini();
  const haze=Math.min(1,Math.max(0,(S.ppm-420)/90));
  if(haze>0){ctx.fillStyle='rgba(214,140,50,'+(haze*.24).toFixed(3)+')';ctx.fillRect(0,0,VW,VH)}
}
function drawCave(dt){
  aim(dt,COLS/2,3.5,.5);
  clearBg();
  const dirt=ROCKS[1];
  for(let s=0;s<=COLS+CAVE_ROWS-2;s++)for(let c=Math.max(0,s-CAVE_ROWS+1);c<=Math.min(COLS-1,s);c++){
    const r=s-c,t=S.cave[r][c];
    if(!onScreen(c,r))continue;
    if(t===0){flat('#2a2230',c,r,0,1,1);spk(c,r,0,3,'#332a3b','#231c29');continue}
    const R=ROCKS[t===9?1:t],sp={c,r,a:R.a,b:R.b,n:5};
    if(t===9){
      box3(c,r,0,1,1,1,'#58b84a',shade(dirt.c,.8),shade(dirt.c,.62));
      faceY(shade('#58b84a',.8),c,r+1,.76,1,.24);faceX(shade('#58b84a',.62),c+1,r,.76,1,.24);
      for(let i=0;i<4;i++)flat(i%2?'#3f9a35':'#6fcf5f',c+.08+hash(c,r,i+30)*.7,r+.08+hash(c,r,i+39)*.7,1,.14,.14,1);
    }else box(c,r,0,1,1,1,R.c,sp);
  }
  const haze=Math.min(1,Math.max(0,(S.ppm-420)/90));
  if(haze>0){ctx.fillStyle='rgba(214,140,50,'+(haze*.12).toFixed(3)+')';ctx.fillRect(0,0,VW,VH)}
}
function draw(dt){
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineJoin='round';ctx.lineWidth=1;
  if(S.mode==='cave')drawCave(dt);else drawWorld(dt);
}

function resize(){
  const w=$('wrap');
  VW=Math.max(200,w.clientWidth-6);VH=Math.max(200,w.clientHeight-6);
  dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(VW*dpr);cv.height=Math.round(VH*dpr);cv.style.width=VW+'px';cv.style.height=VH+'px';
  U=S&&S.mode==='cave'?Math.max(14,Math.min(30,Math.floor(VW/15))):Math.max(18,Math.min(44,Math.floor(Math.min(VW/10.5,VH/8.5))));
  camKey='';gKey='';
}
new ResizeObserver(resize).observe($('wrap'));
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
window.addEventListener('pagehide',save);
window.addEventListener('resize',resize);

let last=performance.now();
function tick(dt){
  if(!S.paused){
    S.t+=dt;S.yt+=dt;S.ls+=dt;S.sv=(S.sv||0)+dt;
    if(S.sv>=5){S.sv=0;save()}
    if(S.ls>=BAL.litterSec){S.ls-=BAL.litterSec;if(S.litter.length<BAL.litterMax)spawnLitter()}
    S.ppm=Math.max(BAL.floor,S.ppm+rate()*dt/YEAR_SEC);
    if(sea()>=LOSE_SEA&&!S.over)end(false,'sea');
    if(S.yt>=YEAR_SEC){S.yt-=YEAR_SEC;yearTick()}else refresh();
    if(S.mode==='world'){
      const sp=7*dt;
      for(const k of ['x','y']){const v='v'+k,d=S[k]-S[v];S[v]=Math.abs(d)<=sp?S[k]:S[v]+Math.sign(d)*sp}
      if(S.vx===S.x&&S.vy===S.y){
        const li=S.litter.findIndex(l=>l.sx===S.sx&&l.sy===S.sy&&l.c===S.x&&l.r===S.y);
        if(li>=0){S.litter.splice(li,1);S.sci+=1;S.litterGot++;toast('+1 🔬 Basura recogida. '+LITTER_FACTS[Math.floor(Math.random()*LITTER_FACTS.length)]);refresh()}
        if(S.enter)enterCave();
        else if(S.hold)tryMove(S.hold[0],S.hold[1]);
        else if(S.path.length){const d=S.path.shift();if(!tryMove(d[0],d[1]))S.path=[]}
        else if(S.after){const a=S.after;S.after=null;S.fx=a.c-S.x;S.fy=a.r-S.y;if(a.a)interact(a.a)}
      }
    }
  }
  setHint();
}
function loop(now){
  requestAnimationFrame(loop);   /* primero, para que un fallo en un fotograma no congele la partida */
  const dt=Math.min(.1,(now-last)/1000);last=now;
  if(!window.__FAST__)tick(dt);
  draw(dt);
}
if(window.__TEST__)window.__g={get S(){return S},yearTick,count,CARDS,RETOS,showCard,setMode,COST,tapCell(c,r){if(S.paused||S.over)return;if(S.mode==='cave')digCell(c,r);else tapWorld(c,r)},POLICIES,run(sec){let t=0;while(t<sec&&!S.paused){tick(.1);t+=.1}return t}};
newGame();setMode('world');if(!tryResume())askName();
requestAnimationFrame(loop);
})();
</script>
